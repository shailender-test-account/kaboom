        - {name: currentEnd, in: query, required: true, schema: {type: string, format: date}}
        - {name: previousStart, in: query, required: true, schema: {type: string, format: date}}
        - {name: previousEnd, in: query, required: true, schema: {type: string, format: date}}
        - {name: parents, in: query, description: JSON array of up to 100 parent keys; empty means all, schema: {type: string}}
        - {name: segments, in: query, description: JSON array of segment names, schema: {type: string}}
        - {name: portfolios, in: query, description: JSON array of PS/Print/Unassigned; unknown or conflicting product terms remain Unassigned, schema: {type: string}}
        - {name: rads, in: query, description: JSON array of Retention/Acquisition/Development/Unknown, schema: {type: string}}
        - {name: basis, in: query, schema: {type: string, enum: [PS, Print], default: PS}}
        - {name: breakdown, in: query, schema: {type: string, enum: [total, segment, portfolio, segment_portfolio, rad], default: total}}
        - {name: sortBy, in: query, schema: {type: string, enum: [touchpoints, leads, hot, opportunities], default: touchpoints}}
        - {name: sortOrder, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: search, in: query, schema: {type: string, maxLength: 200}}
        - {name: newOnly, in: query, schema: {type: string, enum: ["true", "1"]}}
        - {name: abmOnly, in: query, schema: {type: string, enum: ["true", "1"]}}
        - {name: incompleteOnly, in: query, schema: {type: string, enum: ["true", "1"]}}
        - {name: dimension, in: query, schema: {type: string}}
        - {name: dimensionValue, in: query, schema: {type: string, maxLength: 200}}
        - {name: focusParent, in: query, schema: {type: string, maxLength: 200}}
        - {name: focusColumn, in: query, schema: {type: string, maxLength: 300}}
        - {name: focusPeriod, in: query, schema: {type: string, enum: [current, previous]}}
        - {name: focusMetric, in: query, schema: {type: string, enum: [touchpoints, engagedContacts, leads, hot, warm, opportunities, closedWon, closedLost, opportunityValue, prospectiveValue, bookedValue]}}
        - {name: evidencePage, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        "200":
          description: Exact full-cohort totals and paged parents, or all matching rows as CSV. Each period is at most three years. Planning is a current snapshot, not a historical trend.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HpParentPivot"}
            text/csv:
              schema: {type: string}
        "400":
          description: Invalid calendar dates, reversed or oversized ranges, or invalid filter choices
        "401":
          description: Authentication required
        "404":
          description: Client is not an owned HP client
