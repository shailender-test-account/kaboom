openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PlayForge ABM Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: clients
  - name: plays
  - name: journeys
  - name: contacts
  - name: companies
  - name: deals
  - name: analytics
  - name: sequences
  - name: scoring
  - name: banners
  - name: templates
  - name: admin

paths:
  /team-access/sales-history:
    get:
      operationId: listSalesAccessHistory
      summary: Administrator-only tenant-wide ownership and visibility history
      parameters:
        - {in: query, name: dateFrom, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {in: query, name: dateTo, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {in: query, name: actorId, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {in: query, name: kind, schema: {type: string, enum: [owners, visibility]}}
        - {in: query, name: beforeId, schema: {type: integer, minimum: 1, maximum: 2147483647}}
      responses:
        "200":
          description: Up to 25 entries, descending ID order, filtered by recorded UTC day. Inclusive dates span at most 366 days.
          content: {application/json: {schema: {$ref: "#/components/schemas/TenantSalesAccessHistory"}}}
        "400": {description: Invalid filters or date range}
        "401": {description: Sign-in required}
        "403": {description: Administrator required}
  /sales/accounts/{id}/owner-history:
    get:
      operationId: getSalesOwnerHistory
      summary: Administrator-only explicit ownership audit, including deleted account tombstones
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
        - {in: query, name: beforeId, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Immutable history, newest first
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesAccessHistory"}}}
        "403": {description: Administrator required}
  /team-access/{id}/sales-access/history:
    get:
      operationId: getSalesVisibilityHistory
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
        - {in: query, name: beforeId, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Administrator-only immutable visibility history, including deleted member tombstones
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesAccessHistory"}}}
        "403": {description: Administrator required}
  /sales/accounts:
    get:
      operationId: listSalesHotAccounts
      summary: Declared Hot accounts across permitted clients, restricted to account owners unless granted all-account visibility
      parameters:
        - {in: query, name: clientId, schema: {type: integer, minimum: 1}}
        - {in: query, name: search, schema: {type: string, maxLength: 200}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: unassigned, schema: {type: boolean}}
      responses:
        "200":
          description: Live authorized Hot account list; never starts outreach
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesHotAccountList"}}}
        "403": {description: Sales access required}
  /sales/accounts/owners/preview:
    post:
      operationId: previewSalesOwnerBatch
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SalesOwnerBatchInput"}}}
      responses:
        "200":
          description: Administrator review of unassigned Hot accounts; empty user lists load eligible choices
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesOwnerBatchPreview"}}}
        "403": {description: Administrator required}
        "409": {description: Selection changed or is unavailable; nothing saved}
  /sales/accounts/owners/confirm:
    post:
      operationId: confirmSalesOwnerBatch
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SalesOwnerBatchConfirmation"}}}
      responses:
        "200":
          description: Entire batch saved atomically; no outreach or permission changes
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesOwnerBatchResult"}}}
        "403": {description: Administrator required}
        "409": {description: Review expired or permissions/ownership changed; nothing saved}
  /sales/accounts/options:
    get:
      operationId: getSalesAccountOptions
      responses:
        "200":
          description: Permitted clients and effective visibility
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesAccountOptions"}}}
  /sales/accounts/{id}:
    get:
      operationId: getSalesAccount
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Authorized account details and declared Hot evidence
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesAccountDetail"}}}
        "404": {description: Account unavailable}
  /sales/accounts/{id}/owners:
    put:
      operationId: replaceSalesAccountOwners
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SalesAccountOwnerInput"}}}
      responses:
        "200":
          description: Explicit owners saved; roster ownership remains additive
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesAccountDetail"}}}
        "403": {description: Administrator required}
  /team-access/{id}/sales-access:
    get:
      operationId: getMemberSalesAccess
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Effective sales account visibility
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesVisibility"}}}
    put:
      operationId: setMemberSalesAccess
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SalesVisibility"}}}
      responses:
        "200":
          description: Visibility saved independently of client and section grants
          content: {application/json: {schema: {$ref: "#/components/schemas/SalesVisibility"}}}
  /sales-feedback/hot-follow-ups:
    get:
      operationId: listHotFollowUps
      summary: Individually qualified HP contact follow-ups; never starts outreach
      parameters:
        - {in: query, name: clientId, schema: {type: integer}}
        - {in: query, name: accountId, schema: {type: integer}}
        - {in: query, name: contactId, schema: {type: integer}}
        - {in: query, name: parentKey, schema: {type: string}}
        - {in: query, name: status, schema: {type: string, enum: [open, completed], default: open}}
        - {in: query, name: page, schema: {type: integer, default: 1}}
      responses:
        "200":
          description: Scoped worklist and eligible team assignees
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize, assignees]
                properties:
                  items: {type: array, items: {type: object, additionalProperties: true}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
                  assignees: {type: array, items: {type: object, additionalProperties: true}}
  /sales-feedback/hot-follow-ups/{id}:
    patch:
      operationId: updateHotFollowUp
      summary: Assign or complete a currently eligible contact follow-up
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeId: {type: [integer, "null"]}
                complete: {type: boolean}
                note: {type: string, maxLength: 2000}
      responses:
        "200":
          description: Updated follow-up
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /sales-feedback:
    get:
      operationId: listSalesFeedback
      summary: Read sales and telesales feedback without changing qualification
      parameters:
        - {name: clientId, in: query, schema: {type: integer}}
        - {name: accountId, in: query, schema: {type: integer}}
        - {name: contactId, in: query, schema: {type: integer}}
        - {name: parentKey, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: [telesales, sales_rep]}}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected]}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, default: 20}}
      responses:
        "200":
          description: Paginated feedback with identity and provenance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackList"}
    post:
      operationId: addSalesFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesFeedbackInput"}
      responses:
        "201":
          description: Pending feedback saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackEntry"}
  /sales-feedback/options:
    get:
      operationId: getSalesFeedbackOptions
      parameters:
        - {name: clientId, in: query, schema: {type: integer}}
        - {name: accountId, in: query, schema: {type: integer}}
        - {name: contactId, in: query, schema: {type: integer}}
        - {name: search, in: query, schema: {type: string}}
        - {name: accountPage, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: contactPage, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
      responses:
        "200":
          description: Owned clients accounts contacts products and Drive availability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackOptions"}
  /sales-feedback/{id}/review:
    post:
      operationId: reviewSalesFeedback
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesFeedbackReview"}
      responses:
        "200":
          description: Reviewed with audit history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackEntry"}
  /sales-feedback/sources:
    get:
      operationId: listSalesFeedbackSources
      responses:
        "200":
          description: Saved feedback folders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SalesFeedbackSource"}}
    post:
      operationId: addSalesFeedbackSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesFeedbackSourceInput"}
      responses:
        "201":
          description: Source saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackSource"}
  /sales-feedback/sources/{id}:
    put:
      operationId: updateSalesFeedbackSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesFeedbackSourceInput"}
      responses:
        "200":
          description: Source updated without changing historical identity
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackSource"}
  /sales-feedback/sources/{id}/preview:
    get:
      operationId: previewSalesFeedbackSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Workbook headings and bounded preview diagnostics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sales-feedback/sources/{id}/sync:
    post:
      operationId: syncSalesFeedbackSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Imported pending feedback; no outreach or qualification applied
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesFeedbackSyncResult"}
  /contact-verification-usage:
    get:
      operationId: getContactVerificationUsage
      responses:
        "200":
          description: Admin-only all-time tenant verification usage; not provider billing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactVerificationUsage" }
    patch:
      operationId: setContactVerificationLimit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationLimitInput" }
      responses:
        "200":
          description: Admin-only request ceiling updated without resetting counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactVerificationUsage" }
  /contact-databases:
    get:
      operationId: listContactDatabases
      responses:
        "200":
          description: Shared databases, counts, segments, clients and recorded sequence usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactDatabaseOverview" }
  /contact-databases/{id}/datasets:
    get:
      operationId: listContactDatasets
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Paginated dataset history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactDatasetPage" }
  /contacts/{id}/verification:
    get:
      operationId: getContactVerification
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Latest saved verification without a provider lookup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactVerification" }
    post:
      operationId: verifyContactDetails
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Missing details filled, replacements held for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactVerification" }
  /contacts/{id}/verification/{verificationId}:
    patch:
      operationId: reviewContactVerification
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: verificationId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactVerificationReview" }
      responses:
        "200":
          description: Apply reviewed replacements after checking current values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactVerification" }
  /team-access:
    get:
      operationId: listTeamAccess
      responses:
        "200":
          description: Workspace members, visible only to administrators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
  /users/{id}:
    delete:
      operationId: deleteTeamMember
      summary: Permanently delete a workspace login account.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400":
          description: Cannot delete yourself.
        "403":
          description: Administrator access required.
        "404":
          description: User not found in this workspace.
        "409":
          description: The last administrator cannot be removed.
  /users/{id}/password:
    patch:
      operationId: resetTeamMemberPassword
      summary: Explicitly replace a password with an expiring temporary credential.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamPasswordResetInput" }
      responses:
        "200":
          description: Temporary password issued. No message is sent.
          content:
            application/json:
              schema:
                type: object
                required: [ok, temporaryPasswordExpiresAt]
                properties:
                  ok: { type: boolean }
                  temporaryPasswordExpiresAt: { type: string, format: date-time }
        "400":
          description: Invalid password or temporary lifetime.
        "403":
          description: Administrator access required.
        "404":
          description: User not found in this workspace.
  /users/{id}/reissue-temporary-password:
    post:
      operationId: reissueTemporaryPassword
      summary: Replace an explicitly marked temporary password without sending email.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemporaryPasswordOptions" }
      responses:
        "200":
          description: Replacement credential, shown once to the administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMemberCreated" }
        "403":
          description: Administrator access required.
        "409":
          description: User not found or already chose a personal password.
  /users/{id}/access:
    patch:
      operationId: updateTeamAccess
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamAccessInput"
      responses:
        "200":
          description: Updated workspace member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "409":
          description: The last administrator cannot be removed.
  /users/invite:
    post:
      operationId: addTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created local sign-in account; no invitation email is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberCreated"
  /integrations/resend/readiness:
    get:
      operationId: getResendReadiness
      summary: Read-only provider check; never sends an email.
      responses:
        "200":
          description: Connection scope, sender verification and welcome-email safety.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendReadiness"
  /users/welcome-email/preview:
    post:
      operationId: previewUserWelcomeEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WelcomeEmailInput"
      responses:
        "200":
          description: Reviewed recipients and template; no tokens created or mail sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeEmailPreview"
  /users/welcome-email/send:
    post:
      operationId: sendUserWelcomeEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WelcomeEmailInput"
                - type: object
                  required: [confirmed, expectedRecipients]
                  properties:
                    confirmed:
                      type: boolean
                    expectedRecipients:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        required: [id, email]
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
      responses:
        "202":
          description: Provider accepted the emails; this is not an inbox-delivery receipt.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: integer
        "409":
          description: Sending is paused or recipient data changed.
  /auth/setup-password:
    post:
      operationId: setWelcomePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: One-time link redeemed and password set.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /users/bulk:
    post:
      operationId: addTeamMembersBulk
      summary: Create up to 50 local users atomically with shared access settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberBatchInput"
      responses:
        "201":
          description: All users created. Temporary passwords are returned only in this response; no email is sent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMemberCreated"
        "400":
          description: Invalid batch; no users created.
        "409":
          description: An email is already registered; no users created.
  /users/{id}/profile:
    patch:
      operationId: updateTeamProfile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamProfileInput"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /buying-committee/contacts/save:
    post:
      operationId: saveBuyingCommitteeContact
      tags: [Buying Committee]
      summary: Admin explicitly saves one sourced person to its owned CRM account without outreach
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommitteeContactSaveInput"}
      responses:
        "200":
          description: Created contact or safely matched existing contact; no enrollment or intent changes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommitteeContactSaveResult"}
        "400": {description: Invalid confirmation or contact selection}
        "403": {description: Admin required}
        "404": {description: Owned account or sourced contact unavailable}
        "409": {description: Ambiguous identity or email owned by a different account}
  /buying-committee/domain-lookup:
    post:
      operationId: lookupBuyingCommitteeDomain
      tags: [Buying Committee]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommitteeDomainLookupInput"}
      responses:
        "200":
          description: Read-only evidence suggestions; no domain is attached or persisted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommitteeDomainLookupResult"}
        "400": {description: Invalid scope or missing cost acknowledgement}
        "403": {description: Admin required}
        "404": {description: Account unavailable in selected sources}
        "409": {description: Provider unavailable or lookup in progress}
        "502": {description: Provider failed; request may have incurred cost}
  /buying-committee/options:
    get:
      operationId: getBuyingCommitteeOptions
      tags: [Buying Committee]
      summary: Tenant-owned HP clients, database sources and redacted Apollo availability
      responses:
        "200":
          description: Options and admin capabilities; never credentials
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /buying-committee/accounts:
    get:
      operationId: getBuyingCommitteeAccounts
      tags: [Buying Committee]
      summary: Search the selected roster/database sources, intersected with HP account ownership
      parameters:
        - {name: segment, in: query, description: Exact HP Analytics GTM segment; omit for all segments, schema: {type: string, maxLength: 100}}
        - {name: clientId, in: query, required: true, schema: {type: integer}}
        - {name: includeRoster, in: query, schema: {type: boolean, default: true}}
        - {name: audienceIds, in: query, style: form, explode: false, schema: {type: array, items: {type: integer}}}
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
      responses:
        "200":
          description: At most 20 owned accounts, with total and pagination
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /buying-committee/suggestions:
    get:
      operationId: getBuyingCommitteeSuggestions
      tags: [Buying Committee]
      parameters:
        - {name: categories, in: query, required: true, style: form, explode: false, schema: {type: array, items: {type: string, enum: [Security, Collaboration, IT Hardware, Business Services]}}}
      responses:
        "200":
          description: Deterministic designation suggestions, not a provider call
          content:
            application/json:
              schema: {type: object, properties: {designations: {type: array, items: {type: string}}}, required: [designations]}
  /buying-committee/plans:
    get:
      operationId: getBuyingCommitteePlans
      tags: [Buying Committee]
      parameters:
        - {name: clientId, in: query, required: true, schema: {type: integer}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
      responses:
        "200":
          description: Ten plans per page and total
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    post:
      operationId: createBuyingCommitteePlan
      tags: [Buying Committee]
      summary: Admin saves a draft; no sourcing occurs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BuyingCommitteeConfig"}
      responses:
        "201":
          description: Saved plan and targets
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /buying-committee/plans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getBuyingCommitteePlan
      tags: [Buying Committee]
      responses:
        "200":
          description: Owned plan, saved approval and target progress
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      operationId: updateBuyingCommitteePlan
      tags: [Buying Committee]
      summary: Admin edits an unapproved draft and advances its revision
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BuyingCommitteeConfig"}
      responses:
        "200":
          description: Updated plan and targets
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /buying-committee/plans/{id}/copy:
    post:
      operationId: copyBuyingCommitteePlan
      tags: [Buying Committee]
      summary: Admin prepares an unsaved draft from an owned approved plan; no writes or provider calls
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Unsaved targeting choices; explicitly save as a new draft and approve before sourcing
          content:
            application/json:
              schema:
                type: object
                required: [config, accounts]
                properties:
                  config: {$ref: "#/components/schemas/BuyingCommitteeConfig"}
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: integer}
                        name: {type: string}
  /buying-committee/plans/{id}/approve:
    post:
      operationId: approveBuyingCommitteePlan
      tags: [Buying Committee]
      summary: Admin approves the exact draft revision and request budget, without calling Apollo
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, confirm]
              properties:
                revision: {type: integer}
                confirm: {type: boolean, enum: [true]}
      responses:
        "200":
          description: Approved plan and targets
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /buying-committee/plans/{id}/source:
    post:
      operationId: sourceBuyingCommitteeAccount
      tags: [Buying Committee]
      summary: Explicit admin action for one approved account; paid credits may be consumed
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, confirm]
              properties:
                accountId: {type: integer}
                confirm: {type: boolean, enum: [true]}
                retry: {type: boolean, default: false}
      responses:
        "200":
          description: Completion; idempotent for already completed accounts
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /buying-committee/contacts/export:
    get:
      operationId: exportBuyingCommitteeContacts
      tags: [Buying Committee]
      summary: Admin-only PII CSV download for explicitly selected tenant-owned HP accounts
      description: All matching people across pages, using the same all-date identity and verified engagement rules as the committee list. No new sourcing, intent, credentials or outreach. Streamed from a read-only snapshot.
      parameters:
        - {name: country, in: query, description: Filter Apollo prospects by person country; preserve attributable first-party engagement, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: clientId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: accountIds, in: query, required: true, description: Comma-separated selected account IDs (1–1000), schema: {type: string, minLength: 1, maxLength: 12000}}
      responses:
        "200":
          description: Spreadsheet-safe CSV of company, designation, available contact details, provenance, requested categories, sourced date and verified engagement sources
          content:
            text/csv:
              schema: {type: string}
        "400":
          description: Invalid or missing explicit account selection
        "401":
          description: Authentication required
        "403":
          description: Admin contact-PII export authorization required
        "404":
          description: HP client or one of the selected accounts is outside the authorized scope
  /buying-committee/contacts:
    get:
      operationId: getBuyingCommitteeContacts
      tags: [Buying Committee]
      summary: Paginated Apollo prospects plus all-date attributable first-party engagement
      parameters:
        - {name: country, in: query, description: Filter Apollo prospects by person country; preserve attributable first-party engagement, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: clientId, in: query, required: true, schema: {type: integer}}
        - {name: accountIds, in: query, required: true, style: form, explode: false, schema: {type: array, items: {type: integer}}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, default: 25, maximum: 100}}
        - {name: planPage, in: query, description: Independent page of saved legal-account/plan references (25 per page), schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
      responses:
        "200":
          description: Contacts with provenance, verified engagement sources and bounded saved plan links for owned legal accounts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  savedPlans:
                    type: object
                    required: [items, page, hasMore]
                    properties:
                      page: {type: integer}
                      hasMore: {type: boolean}
                      items:
                        type: array
                        maxItems: 25
                        items:
                          type: object
                          required: [planId, clientId, planName, planStatus, country, companyId, companyName, status]
                          properties:
                            planId: {type: integer}
                            clientId: {type: integer}
                            planName: {type: string}
                            planStatus: {type: string}
                            country: {type: [string, "null"]}
                            companyId: {type: integer}
                            companyName: {type: string}
                            status: {type: string}
  /intent/opportunities/monitored-accounts:
    get:
      operationId: listMonitoredAccounts
      summary: List monitored accounts with non-scoring research context
      parameters:
        - name: completeResearch
          in: query
          description: Restrict rows and total to accounts with usable cited news, evidence-backed business directions and HP recommendations; does not change monitoring completion.
          schema: { type: boolean, default: false }
        - { name: accountId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 25 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: clientId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Research context is independent of qualification and BI
          content:
            application/json:
              schema:
                type: object
                required: [total, page, pageSize, items]
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, clientId, domain, lastResearchedAt, latestRunStatus, latestSignal, hasInbound, researchContext]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        clientId: { type: integer }
                        domain: { type: [string, "null"] }
                        lastResearchedAt: { type: [string, "null"] }
                        latestRunStatus: { type: [string, "null"] }
                        latestSignal: { type: [string, "null"] }
                        hasInbound: { type: boolean }
                        researchContext:
                          type: object
                          required: [kind, label, summary, evidence, possibleNeeds, nextAction, caution]
                          properties:
                            kind: { type: string, enum: [expansion, business_context, no_recent_findings] }
                            label: { type: string }
                            summary: { type: string }
                            analysisPoints: { type: array, items: { type: string } }
                            takeaways:
                              type: array
                              items: {$ref: "#/components/schemas/HpResearchTakeaway"}
                            validationSummary: {type: [string, "null"]}
                            diagnostics:
                              type: object
                              description: Read-only assessment of at most the latest 100 stored public findings, independent of provider completion and buying qualification.
                              required: [assessedCount, usableCount, excludedCount, storedFindingCount, truncated, exclusions, unverifiedPublicationDateCount, insufficientOperationalEvidenceCount]
                              properties:
                                assessedCount: {type: integer}
                                usableCount: {type: integer}
                                excludedCount: {type: integer}
                                storedFindingCount: {type: integer}
                                truncated: {type: boolean}
                                unverifiedPublicationDateCount: {type: integer}
                                insufficientOperationalEvidenceCount: {type: integer}
                                exclusions:
                                  type: array
                                  items:
                                    type: object
                                    required: [reason, label, count]
                                    properties:
                                      reason: {type: string}
                                      label: {type: string}
                                      count: {type: integer}
                            businessDirections:
                              type: array
                              items: {$ref: "#/components/schemas/MonitoringBusinessDirection"}
                            possibleNeeds: { type: array, items: { type: string } }
                            nextAction: { type: string }
                            caution: { type: string }
                            evidence:
                              type: array
                              items:
                                type: object
                                required: [id, summary, sourceUrl, occurredAt]
                                properties:
                                  id: { type: integer }
                                  summary: { type: string }
                                  sourceUrl: { type: [string, "null"] }
                                  occurredAt: { type: string }
                                  publishedAt: { type: [string, "null"] }
                                  analysisNote: {type: [string, "null"]}
                                  businessDirections:
                                    type: array
                                    items: {$ref: "#/components/schemas/MonitoringBusinessDirection"}
                                  takeaways:
                                    type: array
                                    items: {$ref: "#/components/schemas/HpResearchTakeaway"}
        "400":
          description: Invalid client scope
  /intent/accounts/{accountId}:
    get:
      operationId: getIntentAccountDetail
      summary: Read account identity or an independent evidence panel without starting research
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: section, in: query, schema: { type: string, enum: [identity, evidence, research, analysis, first-party-source] } }
        - { name: sourceKind, in: query, schema: { type: string, enum: [inbound_submission, intent_evidence] } }
        - { name: sourceId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: clientId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: audienceId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: productId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: categoryIds, in: query, schema: { type: string } }
        - { name: subcategoryIds, in: query, schema: { type: string } }
        - { name: categoryName, in: query, schema: { type: string } }
      responses:
        "200":
          description: Requested panel only; omitted section retains the complete legacy response. Identity never supplies an unqualified score.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { description: "Invalid ID, section or scope" }
        "404": { description: "Account outside tenant, client or audience scope" }
  /intent/contacts/{contactId}:
    get:
      operationId: getIntentContactDetail
      summary: Read contact identity or independent supporting panels without starting actions
      parameters:
        - { name: contactId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: section, in: query, schema: { type: string, enum: [identity, evidence, recommendations, analysis, engagement] } }
        - { name: gtmPage, in: query, description: Page of the contact's own form and questionnaire evidence, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: timelinePage, in: query, description: Page of the contact's all-date KABOOM engagement history, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: clientId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: audienceId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: productId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: categoryIds, in: query, schema: { type: string } }
        - { name: subcategoryIds, in: query, schema: { type: string } }
        - { name: categoryName, in: query, schema: { type: string } }
      responses:
        "200":
          description: Requested panel only; omitted section retains the complete legacy response. Identity is independent of scoring and evidence. Engagement gtmEvidence items may include InboundProvenance for read-only source-copy inspection; copies do not add responses.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { description: "Invalid ID, section or scope" }
        "404": { description: "Contact outside tenant, client or audience scope" }
  /intent/accounts/{accountId}/research-corrections:
    get:
      operationId: getResearchCorrections
      summary: Admin-only public-research findings and correction audit history
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Tenant-owned findings and applied corrections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchCorrectionList" }
        "403": { description: Admin required }
        "404": { description: Account outside tenant }
  /intent/accounts/{accountId}/research-corrections/preview:
    post:
      operationId: previewResearchCorrection
      summary: Create a separately approvable, expiring per-finding proposal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchCorrectionPreviewInput" }
      responses:
        "200":
          description: "Original source facts, old and proposed fitments, exact removals"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchCorrectionProposal" }
        "403": { description: Admin required }
        "404": { description: Finding outside account or tenant }
        "409": { description: Original source facts unavailable or finding not approved }
  /intent/accounts/{accountId}/research-corrections/apply:
    post:
      operationId: applyResearchCorrection
      summary: Apply explicitly approved public-research correction only; never recompute BI or inbound qualification
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchCorrectionApproval" }
      responses:
        "200":
          description: Correction committed with audit; retry view refresh if refreshPending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchCorrectionResult" }
        "400": { description: Explicit approval and reason required }
        "403": { description: Admin required }
        "404": { description: Server proposal outside tenant or account }
        "409": { description: "Stale, expired, replayed or protected source; preview again" }
  /intent/accounts/{accountId}/research-corrections/refresh:
    post:
      operationId: refreshResearchCorrections
      summary: Retry research-view refresh after a committed correction without applying it again
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Research views refreshed
          content:
            application/json:
              schema:
                type: object
                required: [refreshed]
                properties:
                  refreshed: { type: boolean }
        "403": { description: Admin required }
        "404": { description: No applied corrections in account }
