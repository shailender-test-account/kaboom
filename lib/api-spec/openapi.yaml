            application/json:
              schema:
                $ref: "#/components/schemas/BannerZoneSettingsMap"

  /banners/zone-settings/{zone}:
    patch:
      operationId: updateBannerZoneSetting
      tags: [banners]
      summary: Upsert settings for a single named zone
      parameters:
        - name: zone
          in: path
          required: true
          schema:
            type: string
            enum: [top, bottom, sidebar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerZoneSettingBody"
      responses:
        "200":
          description: Updated zone setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerZoneSettingResult"
        "400":
          description: Invalid zone or body

  /banners/{id}:
    get:
      operationId: getBanner
      tags: [banners]
      summary: Get a banner by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerRecord"
        "404":
          description: Not found
    patch:
      operationId: updateBanner
      tags: [banners]
      summary: Update a banner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerBody"
      responses:
        "200":
          description: Updated banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerRecord"
        "404":
          description: Not found
    delete:
      operationId: deleteBanner
      tags: [banners]
      summary: Delete a banner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /banners/{id}/usage:
    get:
      operationId: getBannerUsage
      tags: [banners]
      summary: Get journeys and plays a banner is used in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerUsage"

  # ---- TEMPLATES ----
  /templates:
    get:
      operationId: listEmailTemplates
      tags: [templates]
      summary: List all email templates
      responses:
        "200":
          description: List of email templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
    post:
      operationId: createEmailTemplate
      tags: [templates]
      summary: Create a new email template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailTemplateBody"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"

  /templates/{id}:
    get:
      operationId: getEmailTemplate
      tags: [templates]
      summary: Get an email template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Not found
    patch:
      operationId: updateEmailTemplate
      tags: [templates]
      summary: Update an email template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailTemplateBody"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Not found
    delete:
      operationId: deleteEmailTemplate
      tags: [templates]
      summary: Delete an email template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /templates/{id}/duplicate:
    post:
      operationId: duplicateEmailTemplate
      tags: [templates]
      summary: Duplicate an email template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated template (name prefixed with "Copy of …")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Not found

  # ---- ADMIN ----
  /admin/pipeline-check:
    get:
      operationId: pipelineCheck
      tags: [admin]
      summary: Check email-click → aware stage pipeline for a contact
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Contact email address (tenant-scoped)
      responses:
        "200":
          description: Pipeline status for the contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineCheckResult"
        "400":
          description: Missing email query param
        "404":
          description: Contact not found

  # ---- ADMIN: RESEND CSV BACKFILL ----
  /admin/resend-csv-backfill:
    post:
      operationId: resendCsvBackfill
      tags: [admin]
      summary: Backfill clicked contacts from Resend CSV/XLSX export
      description: |
        Accepts parsed Resend export rows and retroactively advances matched
        pre-aware contacts to `aware` stage, records an `email_click` activity
        event (with same-day dedup), and recomputes intent scores.
        Pass ?dry_run=true to preview matched/skipped/unmatched counts without
        making any changes.
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendCsvBackfillBody"
      responses:
        "200":
          description: Preview counts (dry_run=true) or applied results
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ResendCsvBackfillPreview"
                  - $ref: "#/components/schemas/ResendCsvBackfillResult"
        "400":
          description: Invalid body or no rows provided
        "401":
          description: Not authenticated

  /analytics/hp-bi/filter-options:
    get:
      operationId: getHpBiFilterOptions
      tags: [analytics]
      summary: Current HP roster salesperson assignments, independent of report pagination and filters
      parameters:
        - {name: clientId, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Deduplicated salesperson emails from the tenant-owned HP roster
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HpBiFilterOptions"}
        "401": {description: Authentication required}
        "404": {description: Client is not an owned HP client}
components:
  parameters:
    HpSalesPersonFilter:
      name: salesPerson
      in: query
      description: Exact case-insensitive HP roster assignment email, across all salesperson roles.
      schema: {type: string, maxLength: 320}
    HpOpportunityFilter:
      name: opportunity
      in: query
      description: Account cohort with supplied category data or source-backed category intent; retains all activity of matching accounts.
      schema: {type: string, enum: [Business Services, Business Collaboration, IT Hardware, Security]}
    AnalyticsClientId:
      name: clientId
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    AnalyticsCompanyId:
      name: companyId
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    AnalyticsCompanyIds:
      name: companyIds
      in: query
      required: false
      schema: { type: string }
    AnalyticsInboundOnly:
      name: inboundOnly
      in: query
      required: false
      schema: { type: string, enum: ["1"] }
    AnalyticsAccountStatus:
      name: status
      in: query
      required: false
      description: Recorded GTM OS account status, or no recorded qualification.
      schema: { type: string, enum: [hot, warm, cold, uncategorized] }
    AnalyticsPlayId:
      name: playId
      in: query
      required: false
      description: Matches only recorded activity on journeys explicitly linked to this tenant-owned play.
      schema: { type: integer, minimum: 1 }
    AnalyticsJourneyId:
      name: journeyId
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    AnalyticsStage:
      name: stage
      in: query
      required: false
      schema: { type: string }
    AnalyticsStages:
      name: stages
      in: query
      required: false
      description: Comma-separated journey stages.
      schema: { type: string }
    AnalyticsScoreMin:
      name: scoreMin
      in: query
      required: false
      schema: { type: number, minimum: 0, maximum: 100 }
    AnalyticsScoreMax:
      name: scoreMax
      in: query
      required: false
      schema: { type: number, minimum: 0, maximum: 100 }
    AnalyticsDateFrom:
      name: dateFrom
      in: query
      required: false
      schema: { type: string, format: date }
    AnalyticsDateTo:
      name: dateTo
      in: query
      required: false
      schema: { type: string, format: date }
