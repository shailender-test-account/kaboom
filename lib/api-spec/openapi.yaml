          description: Invalid input IDs

  /analytics/accounts:
    get:
      operationId: getAnalyticsAccounts
      tags: [analytics]
      summary: List tenant accounts with engagement analytics
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: companyId
          in: query
          required: false
          description: A tenant-owned account selection; use companyIds for multiple.
          schema:
            type: integer
            minimum: 1
        - name: companyIds
          in: query
          required: false
          description: Comma-separated tenant-owned account IDs.
          schema:
            type: string
        - name: inboundOnly
          in: query
          required: false
          description: Restrict to inbound accounts. Requires clientId unless explicit account IDs are selected.
          schema:
            type: string
            enum: ["1"]
        - name: status
          in: query
          required: false
          description: Recorded GTM OS account qualification; uncategorized means no inbound qualification.
          schema:
            type: string
            enum: [hot, warm, cold, uncategorized]
        - name: playId
          in: query
          required: false
          description: Matches only recorded activity on journeys explicitly linked to this tenant-owned play.
          schema:
            type: integer
            minimum: 1
        - name: journeyId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: stage
          in: query
          required: false
          schema:
            type: string
        - name: stages
          in: query
          required: false
          description: Comma-separated journey stages.
          schema:
            type: string
        - name: scoreMin
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: scoreMax
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of account summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsAccountsPage"
        "400":
          description: Invalid query parameters
        "401":
          description: Not authenticated

