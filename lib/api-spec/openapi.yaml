  # ---- AUTH ----
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out

  /auth/logout-all:
    post:
      operationId: logoutAllDevices
      tags: [auth]
      summary: Reauthenticate and sign out every device, including this session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, confirm]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 256
                confirm:
                  type: boolean
                  enum: [true]
      responses:
        "204":
          description: All existing sessions revoked; password unchanged.
        "400":
          description: Current password and explicit confirmation required.
        "401":
          description: Sign-in required or current password incorrect.
        "409":
          description: Credentials or sessions changed concurrently; sign in again.

  /auth/password:
    patch:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Replace the current password, including a required temporary password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnPasswordInput"
      responses:
        "200":
          description: Password changed and first-login restriction cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400":
          description: New password is invalid or unchanged.
        "401":
          description: Sign-in required or current password incorrect.
        "409":
          description: Password changed concurrently; sign in again.
