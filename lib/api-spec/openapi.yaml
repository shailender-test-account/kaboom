  /analytics/hp-bi:
    get:
      operationId: getHpBiDashboard
      tags: [analytics]
      summary: HP commercial marketing BI, with current scores and fiscal occurrence-date metrics
      parameters:
        - {$ref: "#/components/parameters/HpSalesPersonFilter"}
        - {$ref: "#/components/parameters/HpOpportunityFilter"}
        - {name: clientId, in: query, required: true, schema: {type: integer}}
        - {name: sortBy, in: query, schema: {type: string, enum: [name, journey, segment, rad, contacts, engagedContacts, touchpoints, leads, hot, opportunities, closedWon, closedLost, values, bookedValues, score, lastActivity, status, gtmStatus]}, description: Sort all matching parent groups before pagination.}
        - {name: sortDir, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: sortCurrency, in: query, schema: {type: string, pattern: "^[A-Z]{3}$", default: INR}, description: ToV and Booked sort only this currency; missing amounts stay last and currencies are never combined.}
        - {name: qualification, in: query, schema: {type: string, enum: [Hot, Warm, Cold]}, description: Filter parent table by current qualification before pagination; dashboard summary totals are unchanged.}
        - {name: gtmSource, in: query, schema: {type: string, enum: [lead_form, event_feedback]}, description: Filter parent accounts with a valid response of this type before pagination; dashboard summary totals are unchanged.}
        - {name: monitoring, in: query, schema: {type: string, enum: [never, overdue]}, description: "Table-only filter before pagination. Never matches any unchecked member; overdue matches any unchecked member or successful completion older than seven days. Read-only; no research or schedule changes."}
        - {name: year, in: query, schema: {type: integer, default: 2027}}
        - {name: segment, in: query, schema: {type: string}}
        - {name: rad, in: query, schema: {type: string}}
        - {name: basis, in: query, schema: {type: string, enum: [PS, Print]}}
        - {name: search, in: query, schema: {type: string}}
        - {name: newOnly, in: query, schema: {type: boolean}}
        - {name: abmOnly, in: query, schema: {type: boolean}}
        - {name: incompleteOnly, in: query, schema: {type: boolean}, description: Include only accounts with missing source-workbook fields; missing context never excludes accounts from the overall register.}
        - {name: dimension, in: query, schema: {type: string}}
        - {name: dimensionValue, in: query, schema: {type: string}}
        - {name: parentKey, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Reconciled dashboard; account scores are current, currencies are separate
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HpBiReport"}
        "400": {description: Invalid filters}
        "401": {description: Unauthorized}
        "404": {description: HP client not owned by tenant}
