        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HpBiMatchSelection"}
      responses:
        "200":
          description: Account attribution resolved without moving conflicting contacts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HpBiObject"}
        "409": {description: Contact identity conflict requires separate CRM review}
  /analytics/hp-bi/manage-account:
    get:
      operationId: getHpAccountManagement
      tags: [analytics]
      parameters:
        - {name: clientId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: accountId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: contactId, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Owned contact, current assignments and HP-scoped journey and sequence choices
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HpBiObject"}
        "404": {description: Contact is outside the selected HP account}
    post:
      operationId: manageHpAccount
      tags: [analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, accountId, contactId, action]
              properties:
                clientId: {type: integer, minimum: 1}
                accountId: {type: integer, minimum: 1}
                contactId: {type: integer, minimum: 1}
                action: {type: string, enum: [update-contact, add-journey, remove-journey, enroll-sequence, cancel-sequence]}
                journeyId: {type: integer, minimum: 1}
                sequenceId: {type: integer, minimum: 1}
                enrollmentId: {type: integer, minimum: 1}
                values:
                  type: object
                  properties:
                    firstName: {type: string, minLength: 1, maxLength: 200}
                    lastName: {type: [string, "null"], maxLength: 200}
                    email: {type: string, format: email, maxLength: 320}
                    phone: {type: [string, "null"], maxLength: 100}
                    title: {type: [string, "null"], maxLength: 300}
                    city: {type: [string, "null"], maxLength: 200}
                    country: {type: [string, "null"], maxLength: 200}
                    dnc: {type: boolean}
      responses:
        "200":
          description: Action result; sequence callers must check the actual enrolled count
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HpBiObject"}
        "204": {description: Manual journey assignment removed; history retained}
        "403": {description: Account management is read-only for this role}
        "409": {description: "Contact or enrollment is ineligible, or assignment is inherited"}
  /analytics/hp-bi/export:
    get:
      operationId: exportHpBi
      tags: [analytics]
      parameters:
        - {$ref: "#/components/parameters/HpSalesPersonFilter"}
        - {$ref: "#/components/parameters/HpOpportunityFilter"}
        - {name: clientId, in: query, required: true, schema: {type: integer}}
        - {name: sortBy, in: query, schema: {type: string, enum: [name, journey, segment, rad, contacts, engagedContacts, touchpoints, leads, hot, opportunities, closedWon, closedLost, values, bookedValues, score, lastActivity, status, gtmStatus]}}
        - {name: sortDir, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: sortCurrency, in: query, schema: {type: string, pattern: "^[A-Z]{3}$", default: INR}}
        - {name: qualification, in: query, schema: {type: string, enum: [Hot, Warm, Cold]}, description: Match the Parent Accounts qualification filter used by the dashboard table.}
        - {name: gtmSource, in: query, schema: {type: string, enum: [lead_form, event_feedback]}, description: Match the Parent Accounts response-source filter used by the dashboard table.}
        - {name: monitoring, in: query, schema: {type: string, enum: [never, overdue]}, description: Match the Parent Accounts monitoring coverage filter including partial groups. Overdue means never checked or last successful completion more than seven days ago.}
        - {name: year, in: query, schema: {type: integer}}
        - {name: segment, in: query, schema: {type: string}}
        - {name: rad, in: query, schema: {type: string}}
        - {name: basis, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: newOnly, in: query, schema: {type: boolean}}
        - {name: abmOnly, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: All filtered parent accounts, not just the visible page
          content:
            text/csv:
              schema: {type: string}
